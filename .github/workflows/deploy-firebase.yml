name: Deploy to Firebase (Staging)

on:
  push:
    branches:
    - main
    - develop
  repository_dispatch:
    types:
    - blog

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Firebase CLI
      run: npm install -g firebase-tools

    - name: Create public directory
      run: mkdir public

    # Blog e competizioni sono un'unica app Next: l'export contiene
    # sia le rotte del blog sia /competizioni.
    - name: Install dependencies
      run: npm ci
      working-directory: ./packages/portal

    - name: Build
      run: npm run build
      working-directory: ./packages/portal

    - name: Copy artifact
      run: cp -r . ../../../public
      working-directory: ./packages/portal/out

    - name: Deploy to Firebase
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      run: firebase deploy --token "$FIREBASE_TOKEN" -P staging
